[project]
name = "skeptic-swarm"
version = "0.1.0"
description = "Skeptic research-loop infrastructure"
requires-python = ">=3.11,<3.15"
dependencies = [
    "modal==1.6.4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "torch>=2.4,<3",
]

[tool.uv]
package = false

[dependency-groups]
agents = [
    "exa-py>=2,<3",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]
dev = [
    "pytest>=8",
]

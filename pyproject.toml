    "modal==1.6.4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]
